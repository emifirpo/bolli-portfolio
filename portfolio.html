    .btn-outline:hover { border-color: #8B1A1A !important; color: #8B1A1A !important; }

    .tag-pill { transition: background 0.2s; }
    .lang-btn { transition: all 0.2s !important; }

      .footer-inner { flex-direction: column !important; align-items: center !important; text-align: center; gap: 0.25rem !important; }

          entries => entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }),

        ids.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
        return () => obs.disconnect();
      }, []);

        cursor: "pointer", background: "none", border: "none",
        borderBottom: `1.5px solid ${active === id ? C.accent : "transparent"}`,
        paddingBottom: "3px",
        color: active === id ? C.text : C.muted,
        fontWeight: active === id ? "600" : "400",

                      <div>
                        <p style={{ fontSize:"0.68rem", color:"rgba(255,255,255,0.32)", marginBottom:"0.2rem", fontWeight:"700", letterSpacing:"0.12em", textTransform:"uppercase" }}>{item.label}</p>
                        <p style={{ fontSize:"0.9rem", fontWeight:"500" }}>{item.value}</p>
                      </div>
                    </a>
                  ))}
                </div>
              </div>
            </div>
          </section>

          {/* ── FOOTER ── */}
          <footer style={{ background:"#080808", padding:"1.75rem 2rem" }}>
            <div className="footer-inner" style={{ maxWidth:"1120px", margin:"0 auto", display:"flex", justifyContent:"space-between", alignItems:"center", flexWrap:"wrap", gap:"0.5rem" }}>
              <p style={{ color:"rgba(255,255,255,0.2)", fontSize:"0.77rem" }}>{t.footer.copy}</p>
              <p style={{ color:"rgba(255,255,255,0.2)", fontSize:"0.77rem" }}>{t.footer.tag}</p>
            </div>
          </footer>

        </div>
      );
    }

    // ─── SUB-COMPONENTS ───────────────────────────────
    function SecHeader({ sec, title, sub, dark }) {
      return (
        <div>
          <p style={{ color:C.accent, fontSize:"0.72rem", fontWeight:"700", letterSpacing:"0.18em", textTransform:"uppercase", marginBottom:"0.6rem" }}>{sec}</p>
          <h2 style={{ fontSize:"clamp(2rem,3.5vw,3rem)", fontWeight:"700", letterSpacing:"-0.025em", color: dark ? "white" : C.text, marginBottom: sub ? "0.75rem" : 0 }}>{title}</h2>
          {sub && <p style={{ fontSize:"1rem", color: dark ? "rgba(255,255,255,0.42)" : C.muted }}>{sub}</p>}
        </div>
      );
    }

    function SideBlock({ title, children, mt }) {
      return (
        <div style={{ marginTop: mt || 0 }}>
          <p style={{ fontSize:"0.7rem", fontWeight:"700", letterSpacing:"0.16em", textTransform:"uppercase", color:C.muted, marginBottom:"1.25rem" }}>{title}</p>
          {children}
        </div>
      );
    }

    function CaseCard({ cs, idx, t }) {
      const reverse = idx % 2 !== 0;
      return (
        <div className="case-card" style={{ background:C.card, borderRadius:"24px", overflow:"hidden", border:`1px solid ${C.border}`, display:"grid", gridTemplateColumns: reverse ? "1fr 420px" : "420px 1fr" }}>

          {/* Visual */}
          <div className="case-visual" style={{ background:cs.color, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", padding:"3rem 2rem", minHeight:"420px", order: reverse ? 1 : 0, position:"relative", overflow:"hidden" }}>
            <div style={{ position:"absolute", top:"-40px", right:"-40px", width:"220px", height:"220px", borderRadius:"50%", border:"2px solid rgba(255,255,255,0.06)" }} />
            <div style={{ position:"absolute", bottom:"-60px", left:"-30px", width:"270px", height:"270px", borderRadius:"50%", border:"2px solid rgba(255,255,255,0.04)" }} />
            <div style={{ position:"relative", zIndex:1, textAlign:"center" }}>
              <div style={{ fontSize:"3.5rem", marginBottom:"1.5rem", filter:"drop-shadow(0 8px 24px rgba(0,0,0,0.3))" }}>{cs.emoji}</div>
              <h3 style={{ color:"white", fontSize:"1.7rem", fontWeight:"800", letterSpacing:"-0.02em", marginBottom:"0.5rem" }}>{cs.title}</h3>
              <p style={{ color:"rgba(255,255,255,0.4)", fontSize:"0.8rem", fontWeight:"500", letterSpacing:"0.08em" }}>{cs.platform}</p>
            </div>
          </div>

          {/* Content */}
          <div className="case-content" style={{ padding:"3rem", display:"flex", flexDirection:"column", justifyContent:"center", order: reverse ? 0 : 1 }}>
            <div style={{ display:"flex", alignItems:"center", flexWrap:"wrap", gap:"0.6rem", marginBottom:"1.25rem" }}>
              <span style={{ background:C.accentLight, color:C.accent, fontSize:"0.7rem", fontWeight:"700", padding:"4px 12px", borderRadius:"20px", letterSpacing:"0.06em" }}>{cs.tag}</span>
              <span style={{ color:C.muted, fontSize:"0.77rem" }}>{cs.ctx}</span>
            </div>
            <h3 style={{ fontSize:"1.7rem", fontWeight:"700", letterSpacing:"-0.02em", marginBottom:"1rem" }}>{cs.title}</h3>
            <p style={{ color:C.muted, lineHeight:"1.8", fontSize:"0.94rem", marginBottom:"1.75rem" }}>{cs.desc}</p>

            <div className="problem-grid" style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"0.75rem", marginBottom:"1.75rem" }}>
              {[[t.work.prob, cs.problem],[t.work.obj, cs.objective]].map(([label,text]) => (
                <div key={label} style={{ background:C.bg, borderRadius:"12px", padding:"1rem 1.1rem", border:`1px solid ${C.border}` }}>
                  <p style={{ fontSize:"0.65rem", fontWeight:"700", color:C.accent, textTransform:"uppercase", letterSpacing:"0.13em", marginBottom:"0.45rem" }}>{label}</p>
                  <p style={{ fontSize:"0.79rem", color:C.muted, lineHeight:"1.65" }}>{text}</p>
                </div>
              ))}
            </div>

            <div>
              <p style={{ fontSize:"0.65rem", fontWeight:"700", color:C.text, textTransform:"uppercase", letterSpacing:"0.13em", marginBottom:"0.75rem" }}>{t.work.proc}</p>
              <div style={{ display:"flex", flexWrap:"wrap", gap:"0.35rem" }}>
                {cs.methods.map(m => (
                  <span key={m} style={{ fontSize:"0.72rem", padding:"3px 10px", borderRadius:"6px", border:`1px solid ${C.border}`, color:C.muted, background:"white" }}>{m}</span>
                ))}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── RENDER ───────────────────────────────────────
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
